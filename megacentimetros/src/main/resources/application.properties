#define el nombre de la aplicacion
spring.application.name=megacentimetros

#definir el puerto de la aplicacion
server.port=9090

#definir url del proyecto
server.servlet.context-path=/megacentimetros

#cadena de conexion
spring.datasource.url=jdbc:mysql://localhost:3306/bdmegacentimetros

#usuario de la base de datos
spring.datasource.username=root

#clave de usuario de base de datos
spring.datasource.password=

#driver de MYSQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

